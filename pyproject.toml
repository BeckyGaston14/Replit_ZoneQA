[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "ZoneQA Bassett testing and release-readiness API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.29.0,<1.0.0",
    "bcrypt>=4.1.3,<5.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.110.1,<1.0.0",
    "google-cloud-storage>=2.14.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "pymupdf>=1.28.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "replit-object-storage>=1.0.2",
    "uvicorn>=0.25.0,<1.0.0",
]

[tool.setuptools]
# This repository is an application, not a distributable Python package.
# Explicitly disable flat-layout package discovery so editable test installs do
# not try to package frontend assets, screenshots, uploads, or temporary files.
packages = []
